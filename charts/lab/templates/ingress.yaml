{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    {{- include "lab.labels" . | nindent 4 }}
    {{- include "lab.selector" "frontend" | nindent 4 }}
  annotations:
    {{- include "lab.albAnnotations" (list . "internal" .Values.ingress.groupName .Values.ingress.securityGroupId) | nindent 4 }}
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/target-group-attributes: {{ printf "deregistration_delay.timeout_seconds=%v" .Values.ingress.deregistrationDelaySeconds }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ printf "%s.%s" .Values.ingress.host .Values.zone }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}

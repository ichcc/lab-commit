version: 0.2

env:
  shell: bash
  variables:
    BASE_IMAGE_PATH: ecr-public/docker/library/python:3.13-slim
    GIT_AUTHOR_NAME: Lab-Commit Pipeline
    GIT_AUTHOR_EMAIL: pipeline@lab-commit.invalid

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - VERSION="$(tr -d '[:space:]' < VERSION)"
      - '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like v1.2.3, got $VERSION"; exit 1; }'
      - CHART_VERSION="${VERSION#v}"
      - VERSION_COMMIT="$(git log -1 --format=%H -- VERSION)"
      - echo "release $VERSION from commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    on-failure: ABORT
    commands:
      - |
        for service in backend frontend; do
          image="$REGISTRY/lab/$service:$VERSION"
          if aws ecr describe-images --repository-name "lab/$service" --image-ids imageTag="$VERSION" >/dev/null 2>&1; then
            if git diff --quiet "$VERSION_COMMIT" HEAD -- "apps/$service"; then
              echo "$image already exists, skipping build"
              continue
            fi
            echo "apps/$service changed after $VERSION was set in $VERSION_COMMIT and $image already exists, bump VERSION to release it"
            exit 1
          fi
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="$REGISTRY/$BASE_IMAGE_PATH" \
            --label org.opencontainers.image.revision="$CODEBUILD_RESOLVED_SOURCE_VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$image" "apps/$service"
          docker push "$image"
        done

  post_build:
    on-failure: ABORT
    commands:
      - |
        sed -i -E "s/^version:.*/version: $CHART_VERSION/; s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/lab/Chart.yaml
      - cat charts/lab/Chart.yaml
      - |
        if git diff --quiet -- charts/lab/Chart.yaml; then
          echo "chart already at $VERSION"
          exit 0
        fi
        git config user.name "$GIT_AUTHOR_NAME"
        git config user.email "$GIT_AUTHOR_EMAIL"
        git add charts/lab/Chart.yaml
        git commit -m "Release $VERSION [skip ci]"
        git push "https://x-access-token:${GITHUB_TOKEN}@${REPOSITORY_URL#https://}" "HEAD:refs/heads/$BRANCH"
